name: tests

on:
  # `edited` re-runs only the research-log check when a pull request's body changes; the other jobs skip it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: |
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth 1 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD
      # The parent reads its metadata/ relative to its own source tree, so a pip
      # install from git imports but cannot build the panel. It is checked out
      # at the pinned commit (PARENT_COMMIT) and installed editable from there;
      # nothing of it is copied here. tests/test_parent_pin.py checks that the
      # imported parent is that clean checkout, that pyproject.toml pins the
      # same commit, and that the panel rebuilds to the published digest.
      - name: Check out the parent at the pin
        run: |
          COMMIT=$(sed -n 's/^PARENT_COMMIT = "\([0-9a-f]*\)"$/\1/p' src/repo_liquidity/__init__.py)
          git init -q parent && git -C parent remote add origin https://github.com/eleonorabjornberg/repo-market-model
          git -C parent fetch -q --depth 1 origin "$COMMIT" && git -C parent checkout -q FETCH_HEAD
      - name: Install (Python 3.11 from the runner's tool cache)
        run: |
          PY=$(ls -d /opt/hostedtoolcache/Python/3.11*/x64/bin | tail -1)/python3
          "$PY" -m venv .venv && .venv/bin/pip install -q -e ./parent && .venv/bin/pip install -q --no-deps -e . && .venv/bin/pip install -q "statsmodels==0.14.6" "numpy==2.4.6" "scipy==1.17.1" "pandas==3.0.6" "patsy==1.0.3" "python-dateutil==2.9.0.post0" "six==1.17.0" "packaging==26.3" "scikit-learn==1.9.1" "joblib==1.6.0" "threadpoolctl==3.7.0" "narwhals==2.26.0"
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -B -m unittest discover -s tests -v

  # L4 (#28; #20, second comment): a pull request that adds or changes results/, docs/stages/, a snapshot or a
  # decision record carries one fenced research-log entry in its body. The body is read from the event payload; the
  # changed paths are the merge commit against its first parent, so the checkout fetches two commits.
  research-log:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: |
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth 2 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD
      - name: Check the research-log entry
        run: python3 -B scripts/check_log_entry.py --event "$GITHUB_EVENT_PATH" --repo "$GITHUB_REPOSITORY"

  # L0 (#21, option (a)): the development records of Stages 1 to 6 were made at an earlier parent pin, with modules
  # since deleted in favour of the parent's (docs/decisions/deleted-duplicates.md). They are verified at the commit
  # and pin they were made from: the record commit's own full suite, after checking its record files are the bytes
  # tracked here (src/repo_liquidity/records.py). The unit job checks only that those bytes are unchanged.
  records:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: |
          git init -q . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth 1 origin "${GITHUB_SHA}" && git checkout -q FETCH_HEAD
      - name: Verify the records at their commit and pin (Python 3.11 from the runner's tool cache)
        run: |
          PY=$(ls -d /opt/hostedtoolcache/Python/3.11*/x64/bin | tail -1)/python3
          "$PY" -B scripts/verify_records.py --workdir "$RUNNER_TEMP/records" --liquidity-url "https://github.com/${GITHUB_REPOSITORY}"
