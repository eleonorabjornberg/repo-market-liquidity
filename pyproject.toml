[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-market-liquidity"
version = "0.0.1"
description = "Phase 3 of repo-market-model: latent reserves and deployable liquidity"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Eleonora Bjornberg"}]
requires-python = ">=3.11,<3.12"
# The parent, pinned to one commit (repo-market-model main at the time this repository was set up).
# Moving the pin is a reviewed change (docs/decisions/dependencies.md).
dependencies = [
  "repo-market-model @ git+https://github.com/eleonorabjornberg/repo-market-model@71ab387e5557cc9ecefb12d1b2bf21d086571388",
]

# Stage 3 (docs/decisions/dependencies.md, statsmodels approved 6 October 2026): pinned exactly, with the
# versions of statsmodels' own dependencies that the install resolved on CPython 3.11, and numpy at the parent's pin.
[project.optional-dependencies]
state-space = [
  "statsmodels==0.14.6",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pandas==3.0.6",
  "patsy==1.0.3",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
  "packaging==26.3",
]

[tool.setuptools.packages.find]
where = ["src"]
