[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-market-liquidity"
version = "0.0.1"
description = "Phase 3 of repo-market-model: latent reserves and deployable liquidity"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Eleonora Bjornberg"}]
requires-python = ">=3.11,<3.12"
# The parent, pinned to one commit (repo-market-model main at the time this repository was set up).
# Moving the pin is a reviewed change (docs/decisions/dependencies.md).
dependencies = [
  "repo-market-model @ git+https://github.com/eleonorabjornberg/repo-market-model@71ab387e5557cc9ecefb12d1b2bf21d086571388",
]

# Stage 3 (docs/decisions/dependencies.md, statsmodels approved 6 October 2026): pinned exactly, with the
# versions of statsmodels' own dependencies that the install resolved on CPython 3.11, and numpy at the parent's pin.
[project.optional-dependencies]
state-space = [
  "statsmodels==0.14.6",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pandas==3.0.6",
  "patsy==1.0.3",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
  "packaging==26.3",
]
# Stage 4 (docs/decisions/dependencies.md, approved 7 October 2026): the parent's published gbm needs scikit-learn.
# Pinned exactly at the lower bounds of the parent's `ml` extra, with what the install resolved on CPython 3.11.
# numpy and scipy are pinned as in `state-space`.
ml = [
  "numpy==2.4.6",
  "scikit-learn==1.9.1",
  "scipy==1.17.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
  "narwhals==2.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
